services:
  api:
    build: .
    image: lab1-api-image 
    container_name: lab1-api-container
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://labuser:labpassword@db:5432/labdb
      - PORT=3000
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: lab1-db-container
    environment:
      - POSTGRES_USER=labuser
      - POSTGRES_PASSWORD=labpassword
      - POSTGRES_DB=labdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: