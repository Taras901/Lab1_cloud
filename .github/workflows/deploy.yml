name: Build and Push to AWS ECR

on:
  push:
    branches:
      - main # Запускається при пуші в гілку main

# Дозволяємо GitHub запитувати тимчасовий токен в AWS (OIDC)
permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::127555670691:role/lab1-github-actions-role
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: 127555670691.dkr.ecr.eu-north-1.amazonaws.com
          ECR_REPOSITORY: lab1-api-repo
          # Використовуємо хеш коміту як тег (вимога лабораторної)
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG